[package]
name    = "hash-rust"
version = "0.1.0"
edition = "2021"

# ── Features ──────────────────────────────────────────────────────────────────
# Build with GPU support (requires CUDA toolkit + nvcc):
#   cargo build --release                        # gpu enabled by default
#   cargo build --release --no-default-features  # CPU only
[features]
default = ["gpu"]
gpu     = ["cudarc"]

# ── Dependencies ──────────────────────────────────────────────────────────────
[dependencies]

# Ethereum
anyhow   = "1"
ethers   = { version = "2", features = ["abigen", "legacy"] }

# Async runtime
tokio    = { version = "1", features = ["full"] }

# CPU parallelism
rayon    = "1"

# Hashing (CPU path)
sha3     = "0.10"

# Encoding
hex      = "0.4"

# HTTP (Telegram notifications)
reqwest  = { version = "0.11", features = ["json"] }
serde_json = "1"

# Env / config
dotenv   = "0.15"

# CPU count for default thread sizing
num_cpus = "1"

# CUDA (optional — only when "gpu" feature is active)
# cudarc 0.9 valid features: driver, std, cublas, curand, nvrtc, f16
cudarc   = { version = "0.9", optional = true, features = ["driver", "std"] }

# ── Build profile ─────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1